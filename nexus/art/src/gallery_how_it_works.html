<!doctype html>
<html><head><meta charset="utf-8"><title>how it works</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  .steps {
    position: absolute; top: 392px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .step { width: 440px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .num { font-family: var(--f-title); font-size: 30px; color: var(--gray-3); font-weight: 400; margin-bottom: 24px; }
  .step h2 { font-size: 27px; margin-top: 40px; letter-spacing: 0.26em; margin-right: -0.26em; }
  .step p { font-size: 22px; margin-top: 22px; color: var(--gray-2); font-weight: 350; line-height: 1.5; }
  .step p b { font-weight: 500; color: var(--gray-1); }
  .arrow { width: 120px; margin-top: 176px; display: flex; justify-content: center; }
  .arrow svg { overflow: visible; }
  .arrow path { fill: none; stroke: var(--gray-3); stroke-width: 1px; stroke-linecap: square; }
</style>
</head>
<body>
<div class="g-page">
  <div class="g-head">
    <h1 class="title">How it works</h1>
    <div class="g-sub">Three steps. With a template, the second is already done.</div>
  </div>
  <div class="steps" id="s"></div>
  <div class="g-foot"><script>document.write(mark(30, 9, 5));</script><span class="wordmark">DOVA STASH</span></div>
</div>
<script>
  var S = [
    ["hotkey", "Look at a chest", "Point at any container in your home<br>and press <b>K</b>."],
    ["templates", "Choose a layout", "Pick the home&rsquo;s template,<br>or make this chest your <b>master</b>."],
    ["auto_sort", "Deposit", "Your haul leaves your pack.<br>Everything finds its place."]
  ];
  var arrow = '<div class="arrow"><svg width="80" height="16" viewBox="0 0 80 16"><path d="M0 8 H78 M70 1 L78 8 L70 15"/></svg></div>';
  document.getElementById("s").innerHTML = S.map(function (s, i) {
    return '<div class="step"><div class="num">' + (i + 1) + '</div>' + icon(s[0], 200, 2) +
      '<h2 class="title">' + s[1] + '</h2><p>' + s[2] + '</p></div>';
  }).join(arrow);
</script>
</body></html>
