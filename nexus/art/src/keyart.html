<!doctype html>
<html><head><meta charset="utf-8"><title>key art</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  body { position: relative; }
  .stack {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 8px;
  }
  .emblem { margin-bottom: 58px; }
  .wordmark { font-size: 104px; }
  .stripwrap { margin-top: 46px; }
  .tagline { margin-top: 44px; font-size: 25px; color: var(--gray-1); font-weight: 350; }
  .foot {
    position: absolute; bottom: 64px; font-size: 15px; color: var(--gray-3);
  }
  .foot.l { left: 88px; }
  .foot.r { right: 88px; }
</style>
</head>
<body>
<div class="stack">
  <div class="emblem"><script>document.write(mark(208, 7, 3.5));</script></div>
  <div class="wordmark">DOVA STASH</div>
  <div class="stripwrap"><script>document.write(strip(20, 210));</script></div>
  <div class="tagline caps">Every home. Every haul. In its place.</div>
</div>
<div class="foot l caps">SKSE plugin &nbsp;·&nbsp; No ESP</div>
<div class="foot r caps">Skyrim SE &nbsp;·&nbsp; AE &nbsp;·&nbsp; VR</div>
</body></html>
