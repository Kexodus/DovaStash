<!doctype html>
<html><head><meta charset="utf-8"><title>features grid</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 360px); grid-template-rows: repeat(2, 300px);
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  /* inner hairlines only: short carved separators, not a full table */
  .cell:nth-child(-n+3)::after {
    content: ""; position: absolute; bottom: 0; left: 50%; width: 220px; margin-left: -110px;
    height: 1px; background: var(--gray-5);
  }
  .cell:not(:nth-child(3n))::before {
    content: ""; position: absolute; right: 0; top: 50%; height: 180px; margin-top: -90px;
    width: 1px; background: var(--gray-5);
  }
  .cell h2 { font-size: 21px; margin-top: 30px; letter-spacing: 0.28em; margin-right: -0.28em; }
  .cell p { font-size: 17px; margin-top: 14px; color: var(--gray-2); font-weight: 350; letter-spacing: 0.02em; text-align: center; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  var F = [
    ["any_home", "Any home", "Vanilla, Creation Club or modded."],
    ["auto_sort", "Auto-sort", "37 categories, one keypress."],
    ["learns", "Learns", "Put it there once. It remembers."],
    ["templates", "Templates", "22 homes ready with zero setup."],
    ["safe", "No item lost", "Enchanted, tempered, renamed: all kept."],
    ["menu", "Two interfaces", "Menu Framework panel or message boxes."]
  ];
  document.getElementById("g").innerHTML = F.map(function (f) {
    return '<div class="cell">' + icon(f[0], 104, 2) + '<h2 class="title">' + f[1] +
      '</h2><p>' + f[2] + '</p></div>';
  }).join("");
</script>
</body></html>
