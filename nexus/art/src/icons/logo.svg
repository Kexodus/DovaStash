<g transform="translate(0 -10)">
<path class="m" d="M152 76 L56 140 H200 L104 76"/>
<path class="m" d="M56 140 V204 H200 V140"/>
<path class="m" d="M104 140 V204 M152 140 V204"/>
</g>
</svg>
