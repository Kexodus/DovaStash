<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- Dova Stash mark: a longhouse gable with crossed horns over a three-bay
     chest, inside a chamfered square frame. Strokes scale with the mark.
     .f = frame, .m = mark. Pages override stroke widths via --fw / --mw. -->
<style>.f,.m{fill:none;stroke:#fff;stroke-linecap:square;stroke-linejoin:miter;stroke-miterlimit:8}.f{stroke-width:4}.m{stroke-width:8}</style>
