<!doctype html>
<html><head><meta charset="utf-8"><title>features grid</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 380px); grid-template-rows: repeat(2, 300px);
  }
  .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
  }
  .cell h2 { font-size: 21px; margin-top: 30px; letter-spacing: 0.28em; margin-right: -0.28em; }
  .cell p { font-size: 17px; margin-top: 14px; color: var(--gray-2); font-weight: 350; letter-spacing: 0.02em; text-align: center; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  var F = [
    ["auto_sort", "Auto-sort", "Any home, 39 categories, one key."],
    ["learns", "Learns", "Put it there once. It remembers."],
    ["templates", "Templates", "32 home templates, zero setup."],
    ["displays", "Displays", "Your best gear on racks and plaques."],
    ["mannequin", "Mannequins", "Your best matching set, or the one you pick."],
    ["workbench", "Crafting", "Stored materials at hand. The rest goes back."]
  ];
  document.getElementById("g").innerHTML = F.map(function (f) {
    return '<div class="cell">' + icon(f[0], 104, 2) + '<h2 class="title">' + f[1] +
      '</h2><p>' + f[2] + '</p></div>';
  }).join("");
</script>
</body></html>
